name: Category call-context tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  context-and-allocation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Input-free call-context and allocation regression
        run: |
          make category-contexts-test
          make allocation-test
