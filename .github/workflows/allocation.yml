name: Allocation evidence tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-and-native-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic relocation and native candidate tests (no game or VC6)
        run: make allocation-test
