name: Private bundle bootstrap tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Input-free private bundle safety tests
        run: make private-bundle-test
