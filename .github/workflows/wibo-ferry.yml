name: Temporary public calibration ferry

on:
  pull_request:
    paths:
      - '.github/workflows/wibo-ferry.yml'

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact PR source
        run: git archive --format=tar.gz HEAD -o source.tar.gz
      - name: Download pinned Wibo 1.2.0
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o wibo-x86_64 \
            https://github.com/decompals/wibo/releases/download/1.2.0/wibo-x86_64
          echo '13f86a2d618f0dbe67179d349625345eabf9b46450295cb4c904e49f6aff85af  wibo-x86_64' | sha256sum -c -
          chmod +x wibo-x86_64
          ./wibo-x86_64 --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-public-inputs
          path: |
            wibo-x86_64
            source.tar.gz
          if-no-files-found: error
          retention-days: 1
