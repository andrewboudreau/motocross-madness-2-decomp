name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed evidence and binary guardrails
        run: make static-check
      - name: Check decompilation progress document
        run: make progress-check
      - name: Run all input-free regression tests
        run: make test
