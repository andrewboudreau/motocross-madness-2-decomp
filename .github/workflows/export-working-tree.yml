name: Export working tree

on:
  push:
    branches:
      - agent/ecosystem-vc6

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove git metadata
        run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-vc6-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
