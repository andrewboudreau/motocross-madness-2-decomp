name: Category pilot lifetime tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pilots-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Input-free CFG and native C++ model tests
        run: make category-pilots-test categories-test category-contexts-test allocation-test
