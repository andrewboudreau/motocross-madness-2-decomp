name: VC6 static evidence tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test COFF archive and CRT atlas helpers
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_coff_archive.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_crt_atlas.py' -v
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_vc6_profile_matrix.py' -v
